name = "dhankund-api"
compatibility_date = "2024-03-20"
compatibility_flags = [ "nodejs_compat_v2" ]
main = "worker.js"

[env.production]
name = "dhankund-api"
route = { pattern = "api.dhankund.com", custom_domain = true }

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "dhankund-storage"

[[env.production.send_email]]
name = "SEB"

[[env.production.d1_databases]]
binding = "DB"
database_name = "dhankund-crm"
database_id = "FILL_ME_D1_DATABASE_ID"

# WhatsApp Cloud API
# Durable Object keeps a broadcast sending batches without holding one request
# open; the cron restarts a campaign that stopped half way.
[[env.production.durable_objects.bindings]]
name = "WHATSAPP_SENDER"
class_name = "WhatsappBroadcastSender"

[[env.production.migrations]]
tag = "v1-whatsapp-sender"
new_classes = ["WhatsappBroadcastSender"]

[env.production.triggers]
crons = ["*/5 * * * *"]
