name = "dhankund-official-site"
compatibility_date = "2024-03-20"
compatibility_flags = [ "nodejs_compat_v2" ]
main = "worker.js"

[assets]
directory = ".vercel/output/static"

[env.production]
name = "dhankund-official-site"
route = { pattern = "www.dhankund.com", custom_domain = true }

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "dhankund-storage"

[[env.production.send_email]]
name = "SEB"
