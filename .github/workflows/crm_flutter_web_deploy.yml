name: Deploy Flutter Web to Cloudflare Workers with Assets

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhankund_crm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Worker Dependencies
        run: npm install

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Validate Required Secrets
        run: |
          if [ -z "${{ secrets.D1_DATABASE_ID }}" ]; then echo "ERROR: D1_DATABASE_ID is missing"; exit 1; fi
          if [ -z "${{ secrets.SESSION_SECRET }}" ]; then echo "ERROR: SESSION_SECRET is missing"; exit 1; fi
          if [ -z "${{ secrets.ADMIN_EMAIL }}" ]; then echo "ERROR: ADMIN_EMAIL is missing"; exit 1; fi
          if [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then echo "ERROR: ADMIN_PASSWORD is missing"; exit 1; fi

      - name: Configure Wrangler (D1 database id)
        run: |
          sed -i "s#FILL_ME_D1_DATABASE_ID#${{ secrets.D1_DATABASE_ID }}#g" wrangler.toml

      - name: Create config.env file
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > config.env
          echo "CLOUDFLARE_API_BASE_URL=${{ secrets.API_BASE_URL }}" >> config.env

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute dhankund-crm --remote --file=schema.sql

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf %s "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf %s "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf %s "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          if [ -n "$FIREBASE_PROJECT_ID" ]; then printf %s "$FIREBASE_PROJECT_ID" | npx wrangler secret put FIREBASE_PROJECT_ID; fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then printf %s "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT; fi

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers with Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test CRM login
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          sleep 3
          node <<'NODE'
          (async function () {
          var url = "https://dhankund-crm-web.nssite.workers.dev/api/v1/auth/login";
          var res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }) });
          var text = await res.text();
          var body = {};
          try { body = JSON.parse(text); } catch (e) {}
          console.log("login_http_status=" + res.status);
          console.log("login_error=" + (body.error || ""));
          var ok = res.status >= 200 && res.status < 300 && !!body.token;
          console.log(ok ? "LOGIN_OK" : "LOGIN_FAILED");
          if (!ok) { process.exit(1); }
          })();
          NODE
