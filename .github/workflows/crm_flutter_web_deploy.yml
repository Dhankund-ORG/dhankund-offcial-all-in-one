name: Deploy Flutter Web to Cloudflare Workers with Assets

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhankund_crm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.CRM_FIREBASE_WEB }}" ]; then
            echo "ERROR: CRM_FIREBASE_WEB secret is missing or empty. Please add it to GitHub Secrets."
            exit 1
          fi

      - name: Create config.env file
        run: |
          echo "AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}" > config.env
          echo "AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}" >> config.env
          echo "AWS_S3_ENDPOINT=${{ secrets.AWS_S3_ENDPOINT }}" >> config.env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> config.env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> config.env
          
          DSA_WEB=$(echo '${{ secrets.DSA_FIREBASE_WEB }}' | tr -d '\n' | tr -d '\r')
          echo "DSA_FIREBASE_WEB='${DSA_WEB}'" >> config.env
          
          CRM_WEB=$(echo '${{ secrets.CRM_FIREBASE_WEB }}' | tr -d '\n' | tr -d '\r')
          echo "CRM_FIREBASE_WEB='${CRM_WEB}'" >> config.env

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers with Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
