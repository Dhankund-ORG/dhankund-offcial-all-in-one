name: Deploy CRM Web (static frontend)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'dhankund_crm/**'
      - '.github/workflows/crm_flutter_web_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhankund_crm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Validate API Base URL Secret
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then echo "ERROR: API_BASE_URL is missing (should point to the shared API worker)"; exit 1; fi

      - name: Set Environment Variables
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ENV_NAME=preview" >> $GITHUB_ENV
            echo "API_URL=https://dev.api.dhankund.com" >> $GITHUB_ENV
          else
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.API_BASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Create config.env file
        run: |
          echo "API_BASE_URL=$API_URL" > config.env
          echo "CLOUDFLARE_API_BASE_URL=$API_URL" >> config.env

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers with Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env $ENV_NAME

      - name: Smoke test CRM login (via shared API)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          sleep 3
          node <<'NODE'
          (async function () {
          var url = process.env.API_URL + "/api/v1/auth/login";
          var res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }) });
          var text = await res.text();
          var body = {};
          try { body = JSON.parse(text); } catch (e) {}
          console.log("login_http_status=" + res.status);
          console.log("login_error=" + (body.error || ""));
          var ok = res.status >= 200 && res.status < 300 && !!body.token;
          console.log(ok ? "LOGIN_OK" : "LOGIN_FAILED");
          if (!ok) { process.exit(1); }
          })();
          NODE
