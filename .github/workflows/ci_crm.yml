name: CI - CRM Flutter App

on:
  pull_request:
    branches:
      - '**'
  push:
    branches-ignore:
      - master
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhankund_crm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Worker JS syntax (shared root backend)
        working-directory: ${{ github.workspace }}
        run: |
          for f in worker.js worker/db.js worker/auth.js worker/fcm.js worker/openapi.js worker/migrate.js; do
            cp "$f" "/tmp/check_$(basename "$f" .js).mjs"
            node --check "/tmp/check_$(basename "$f" .js).mjs" || exit 1
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create dummy config.env for analyzer
        run: touch config.env

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Verify Web Build
        run: flutter build web --release
