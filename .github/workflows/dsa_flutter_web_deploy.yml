name: Deploy DSA Web (static frontend)

on:
  push:
    branches:
      - master
    paths:
      - 'DSA-Banker-flutter app/**'
      - '.github/workflows/dsa_flutter_web_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'DSA-Banker-flutter app'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate API Base URL Secret
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then echo "ERROR: API_BASE_URL is missing (should point to the shared API worker)"; exit 1; fi

      - name: Create config.env file
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > config.env
          echo "CLOUDFLARE_API_BASE_URL=${{ secrets.API_BASE_URL }}" >> config.env

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Cloudflare Workers with Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
