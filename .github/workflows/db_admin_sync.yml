name: Sync D1 Admin to GitHub Secrets (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Wrangler (D1 database id)
        run: sed -i "s#FILL_ME_D1_DATABASE_ID#${{ secrets.D1_DATABASE_ID }}#g" wrangler.toml

      - name: Inject admin email into SQL
        run: sed -i "s#__ADMIN_EMAIL__#${{ secrets.ADMIN_EMAIL }}#g" db_admin_sync.sql

      - name: Sync admin credentials in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute dhankund-crm --env production --remote --file=db_admin_sync.sql

      - name: Verify admin row
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute dhankund-crm --env production --remote --command "SELECT id, email, role, CASE WHEN password_hash IS NULL THEN 'NULL' ELSE 'HASHED' END AS pw FROM users WHERE role='admin'"

      - name: Smoke test login with secret credentials
        env:
          API_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          sleep 3
          node <<'NODE'
          (async function () {
          var url = process.env.API_URL + "/api/v1/auth/login";
          var res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }) });
          var text = await res.text();
          var body = {};
          try { body = JSON.parse(text); } catch (e) {}
          console.log("login_http_status=" + res.status);
          console.log("login_error=" + (body.error || ""));
          var ok = res.status >= 200 && res.status < 300 && !!body.token;
          console.log(ok ? "LOGIN_OK" : "LOGIN_FAILED");
          if (!ok) { process.exit(1); }
          })();
          NODE