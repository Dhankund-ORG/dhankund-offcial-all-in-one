name: Seed Sample Blog Post (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Wrangler (D1 database id)
        run: sed -i "s#FILL_ME_D1_DATABASE_ID#${{ secrets.D1_DATABASE_ID }}#g" wrangler.toml

      - name: Insert sample blog post
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute dhankund-crm --env production --remote --command "INSERT OR REPLACE INTO blog_posts (id, title, slug, content, excerpt, cover_image, category_id, category_name, tags, language, status, author_name, seo_title, seo_description, published_at, updated_at, views, created_at) VALUES ('seed_welcome', 'Dhankund Blog में आपका स्वागत है', 'welcome-to-dhankund-blog', '## Dhankund Blog में आपका स्वागत है

यह Dhankund का आधिकारिक ब्लॉग है। यहाँ हम लोन टिप्स, DSA गाइड, बिज़नेस की जानकारी और समाचार साझा करेंगे।

- **लोन टिप्स** — सही लोन कैसे चुनें
- **DSA गाइड** — Direct Selling Agent कैसे बनें
- **बिज़नेस** — वित्तीय वृद्धि की जानकारी

नियमित रूप से नए लेख आते रहेंगे। धन्यवाद!', 'Dhankund का आधिकारिक ब्लॉग — लोन, DSA और बिज़नेस की जानकारी।', NULL, NULL, NULL, '[]', 'hi', 'published', 'Dhankund Team', NULL, NULL, datetime('now'), datetime('now'), 0, datetime('now'))"