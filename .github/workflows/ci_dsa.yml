name: CI - DSA Flutter App

on:
  pull_request:
    branches:
      - '**'
  push:
    branches-ignore:
      - master
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'DSA-Banker-flutter app'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create dummy config.env for analyzer
        run: touch config.env

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Verify Web Build
        run: flutter build web --release
