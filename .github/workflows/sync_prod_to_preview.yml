name: Sync Production to Preview

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_database:
    name: Sync D1 Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Configure Wrangler (D1 database id)
        run: sed -i "s#FILL_ME_D1_DATABASE_ID#${{ secrets.D1_DATABASE_ID }}#g" wrangler.toml

      - name: Export Production Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export dhankund-crm --env production --remote --output=prod_dump.sql

      - name: Prepare Clean Dump (Add DROP TABLE)
        run: |
          # Automatically add a DROP TABLE statement before each CREATE TABLE
          # to ensure the preview database tables are cleanly overwritten.
          awk '/^CREATE TABLE/ { match($0, /CREATE TABLE ("[^"]+"|[^ ]+)/, arr); if (arr[1]) print "DROP TABLE IF EXISTS " arr[1] ";" } { print }' prod_dump.sql > clean_dump.sql

      - name: Import into Preview Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute dhankund-crm-preview --env preview --remote --file=clean_dump.sql

  sync_r2_bucket:
    name: Sync R2 Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash

      - name: Check S3 Credentials
        run: |
          if [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.R2_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::R2_ACCESS_KEY_ID or R2_SECRET_ACCESS_KEY is missing. Please add them to GitHub Secrets."
            exit 1
          fi

      - name: Sync Production R2 to Preview R2
        env:
          RCLONE_CONFIG_CF_TYPE: s3
          RCLONE_CONFIG_CF_PROVIDER: Cloudflare
          RCLONE_CONFIG_CF_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_CF_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_CF_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          rclone sync cf:dhankund-storage cf:dhankund-storage-preview --progress
