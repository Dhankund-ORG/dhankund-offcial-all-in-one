name: Deploy Dhankund Official Site to Cloudflare Workers with Assets

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'dhankund_official_site/**'
      - '.github/workflows/official_site_deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    defaults:
      run:
        working-directory: ./dhankund_official_site

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './dhankund_official_site/package-lock.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js app for Cloudflare
        run: npm run pages:build

      - name: Debug Output Directory
        run: |
          ls -la
          ls -la .vercel/output || echo "No .vercel/output found"
          ls -la .vercel/output/static || echo "No static found"

      - name: Create .assetsignore
        run: echo "_worker.js" > .vercel/output/static/.assetsignore

      - name: Deploy to Cloudflare Workers with Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
